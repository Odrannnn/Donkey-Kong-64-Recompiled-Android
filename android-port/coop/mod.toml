[manifest]
id = "odrannnn_dk64_lan_coop"
version = "0.69.0"
display_name = "DK64 LAN Co-op Prototype"
description = "Experimental two-player LAN co-op. Version 0.69.0 synchronizes the five direct vanilla Baboon Blast completion exits in Japes, Aztec, Galleon, Factory and Castle while both players are active Donkey in the same course; the full stock scripted transition path runs locally, rewards and progress remain owned by vanilla and the item/world channels, and the nested Fungi and Caves bonus-barrel endings stay excluded. Version 0.68.0 shares successful completion of Fungi Forest's vanilla Diddy Owl Race in either direction while each game retains its local rings, flight, failure path, presentation, reward and flag. Version 0.67.0 shares successful completion of the three exact vanilla Batty Barrel Bandit instances in either direction while each game retains its local reels, timer, reward, flag, destination and presentation. Version 0.66.0 shares successful completion of both Fungi Forest Rabbit Race rounds in either direction while each game retains its local race simulation, failure path, presentation, refill, reward and cleanup. Version 0.65.0 shares successful completion of the three exact vanilla Minecart Mayhem instances in either direction while each game retains its local race simulation, failure path, presentation, exit and reward. Version 0.64.0 shares the 24 generic instrument-pad timer loops in the Aztec, Galleon, Factory, Castle and Caves lobbies through exact state-1 activation edges. Version 0.63.0 shares successful completion of the four exact vanilla Kremling Kosh instances in either direction while each game retains its local score, presentation, exit and reward. Version 0.62.0 applies 29 audited race, minecart, bonus-barrel and lobby GB rewards immediately on the owning main map while every other same-level reward stays deferred. Optional combat shares gun/orange visuals, downward enemy health, and blue/gold beaver, regular Kremling, Klump, Mushroom Man, Robo-Kremling, Kosha, both Zinger variants, Robo-Zinger, bat, all five Kasplat, Shuri, Gimpfish, all three Klaptrap, Krossbones, Kaboom, Klobber, Pufftup, sheeted Kritter, both Mr. Dice variants, Sir Domino, Spiderling, glasses fireball, Ruler, Book and Toy Monster defeats across 58 reviewed vanilla gameplay maps, including ordinary level interiors, Hideout Helm, DK Isles, four lobbies, the Fungi Spider encounter and Chunky's Caves igloo. Compact 20-record pages cover every supported live enemy and pending defeat; the mixed Fungi Spider room reserves one wire slot for boss motion and carries nineteen ordinary records per page so no Spiderling is lost. Duplicated page rotation is independent of render-frame timing. Optional host enemy movement corrects guest positions/facing. Version 0.40 retains the ability to correct the guest's current local enemy animation frame after exact identity, life and local-clip checks. Each reciprocally bound sample is evaluated once so local animation advances between network updates; it never transfers a clip, control state or attack. Attacks and AI still run locally. Version 0.44.0 shares bounded damage phases for Army Dillo, Dogadon, Mad Jack, Pufftoss, King Kut Out, all five K. Rool rounds and Tiny's shoe sequence through pinned vanilla handlers and state gates. Version 0.56.0 adds the Fungi Spider's single final vulnerable hit; its pinned handler retains the death, reward, cutscene and exit. Version 0.57.0 also enables reciprocally bound Spider position/facing and guarded pose correction while preserving its Spiderling records. Version 0.61.0 retains the host's last verified cutscene target for 90 rendered frames in the same room epoch and prioritizes it on full transient pages, letting a lagging Join complete guarded catch-up after the host cutscene closes. Version 0.60.0 lets an already-matching active cutscene recover one camera phase per rendered frame when a short phase passed between network samples; it cannot start, rewind or directly skip a cutscene. Version 0.59.0 synchronizes the sixteen-cell Caves Ice Tomato board and its host countdown only while both local encounter controllers are active. A final board sample precedes the expiry edge so each vanilla controller evaluates the same board; outcome, cutscenes, reward and exit stay local. With the movement option, reciprocally bound boss position/facing follows the host on the guest. Full pose mode also evaluates the host normalized frame only when the guest already runs a matching local boss clip; callbacks are suppressed. Boss AI, attacks, timers, clip selection, projectiles and player damage remain local. Kasplat blueprint drops still run locally; blueprint ownership uses the item channel. Klaptrap skeleton remnants and detached Krossbones parts remain local. Optional sharing of 40 blueprints, 20 fairies, 10 crowns, 8 boss keys 2 special coins, 40 banana medals, all 201 GBs, 1700 ordinary pickups, 104 balloons, 16 rainbow coins, Chunky's rear-Japes-boulder bunch and saved final K. Rool defeat in isolated item saves. The victory flag requires the full key/K. Lumsy route and never forces a remote ending cutscene. Saved two-coin Arcade replay access also transfers after the lever and Arcade GB, without charging the receiver. Also shares Kong rescues, shop moves/upgrades, melon capacity and K. Lumsy progression. Also shares training, camera/shockwave, 87 vanilla Bananaport tags and all eight B. Locker clearances. Receive pad tags outside their map and clearances outside lobbies, then re-enter. Also shares ten permanent Aztec/Galleon/Fungi world unlocks outside their level: llama rescue and temple cooling, seal rescue, five Giant Mushroom gun switches, first rabbit race and grown beanstalk. Also shares eight permanent Factory hatch/gate/core, breakable-grate, question-mark-box, arcade-lever and crown-grate flags outside Factory. Adds 82 more permanent completions across all levels, Isles/lobbies and Helm: gates, walls, puzzles, pearls, boss-portal closure, training exit, Rareware room, Helm shutdown/doors and four further warp tags. Receiving normally waits outside affected levels/interiors; Training Grounds now admits only its reviewed training and exit IDs and updates the loaded switch/door scripts; prerequisites must be owned. The first Japes gate is handled by item sharing; the obsolete standalone gate experiment has been retired. Also shares reversible Galleon water height, Fungi day/night and the Caves-lobby pressure switch through independent host-authoritative revisions. With automatic world refresh, a loaded Caves lobby runs its exact vanilla press/release sequence; otherwise leave the affected lobby/level to exchange safely. By default incoming changes wait outside the affected level; the optional automatic world refresh applies 17 reviewed gate/hut/switch/door flags live and reloads the safe main map only for complex state. Wait for LAN WORLD: SYNCED before using switches. Host state wins stale/concurrent requests and reconnects. Also shares cumulative Troff and Scoff feeding for all five Kongs in all seven levels. Missing feeding milestones consume matching available bananas once and update the boss-door total outside that level. Feeding the same Kong on both peers merges by maximum, not addition. Wait for ITEMS: SYNCED before and after feeding. Hideout Helm's five instrument pads, Factory Snatch Room grate, two punch switches, two breakable grates, coconut switch, production, Chunky-cage and three instrument-pad switches, Diddy's 3-1-2-4 room, Lanky's piano, Tiny's dartboard, Galleon's Enguarde door, breakable gate, three cannon targets, six gun and seven instrument/slam switches, all eleven five-door-temple weapon panels, Fungi's main-map breakable door, five tunnel gun switches, Diddy night and Lanky mushroom slam switches, dark-attic guitar pad, Lanky attic slam switch, Winch Room up button and two Thornvine Barn slam boxes, the Mill-front slam box, rear-mill triangle pad and two rear-mill question boxes, the Aztec/Fungi lobby feather switches, Isles rocket-barrel trombone and Fairy Island sax pads and two Caves boulder pads, three breakable ice walls, Tiny's four-step Caves igloo target, Chunky's three Caves cabin gun targets, the three Castle basement slam switches, Castle Lanky/Tiny and DK/Diddy/Chunky crypt switches and Castle tree door switches, Llama Temple's coconut/bongo, grape and quicksand switches, its sixteen matching heads and Tiny Temple's opening/guitar/charge switches plus its ordered KONG letters and Japes' seventeen Diddy-cage, hive, painting-room, Diddy-cave, Kong-hut, timed-door and Rambi switches plus its paired Mountain and GB slam switches and Aztec's four exterior gate switches, five revealed totem switches, three llama switches, Diddy's exterior guitar pad and all four blueprint-door switches use typed same-area progression; Giant Clam also follows the host open/close cycle while both players share its Japes room; other temporary/reversible switches and machine timing stay local; the saved Arcade payment outcome transfers without copying the fee or launching the game. All experiments default Off and need gameplay validation. Version 0.44.0 retains independent exploration as the default; a join-side option enables host-follow transitions for 169 reviewed ordinary vanilla routes across DK Isles, lobbies, level portals, tunnels and level interiors. Monotonic tickets persist briefly through host arrival and reject stale/replayed routes. Castle-cannon entry, Helm, bosses, Troff and Scoff, other race and bonus transitions, cutscenes and menus remain local. Item pages keep exchanging from different maps after each device has captured one verified safe snapshot; unsafe overlays use that cached snapshot and defer local writes. Host/Join show one adventure file plus Delete; Role Off keeps the vanilla three-file menu. Version 0.52.0 durably journals fully acknowledged guest checkpoints beside the isolated campaign save and restores promoted authority after a process restart. It retains 0.51.0 room-code LAN rediscovery, conservative manual promotion, upstream 1.0.2 map-load and EEPROM-load lifecycle boundaries, and explicit host/guest-copy overrides. Version 0.53.0 exchanges durable authority generations and node identities, deterministically retires a stale host when a newer promoted host is found, and remembers the former host as a Join after restart. Requires a matching 0.69.0 package; includes a read-only private-LAN trace endpoint; existing loader unchanged. Trusted LAN only. AI-assisted independent mod."
short_description = "Experimental LAN player presence; not full campaign co-op."
authors = ["Odrannnn (AI-assisted)"]
game_id = "dk64"
# Upstream tag 1.0.2 advertises 1.0.1 internally; its new callback table is required.
minimum_recomp_version = "1.0.1"
native_libraries = [{ name = "dk64_coop_bridge", funcs = ["dk64_coop_start", "dk64_coop_local_ipv4", "dk64_coop_recovery_configure_v69", "dk64_coop_recovery_status_v69", "dk64_coop_recovery_promote_v69", "dk64_coop_tick_v69", "dk64_coop_stop"] }]

[inputs]
elf_path = "build/mod/mod.elf"
mod_filename = "dk64_lan_coop"
func_reference_syms_file = "../upstream/DK64Syms/dump.toml"
data_reference_syms_files = ["../upstream/DK64Syms/data_dump.toml"]
additional_files = []

[[manifest.config_options]]
id = "role"
name = "LAN session (restart required)"
description = "Off leaves normal play unchanged. Host/Join use separate experimental saves and start a two-player LAN session. Set before launching the game."
type = "Enum"
options = ["Off", "Host", "Join"]
default = "Off"

[[manifest.config_options]]
id = "save_profile"
name = "Co-op campaign save (restart)"
description = "Selects an isolated persistent co-op campaign on this device. Campaign 1 keeps existing co-op progress from earlier releases. Campaigns 2-8 use separate files. Choose the corresponding campaign number on both peers. Host and Join retain separate local copies for conflict safety and expose only that campaign's first physical adventure file plus Delete. Changing the host IP, port or room code does not change this save selection. Role Off continues to use the normal non-co-op save and all three adventure files."
type = "Enum"
options = ["Campaign 1 (existing)", "Campaign 2", "Campaign 3", "Campaign 4", "Campaign 5", "Campaign 6", "Campaign 7", "Campaign 8"]
default = "Campaign 1 (existing)"

[[manifest.config_options]]
id = "host_ip"
name = "Host IPv4 address"
description = "Join only: enter the last known LAN IPv4 address shown on the host, for example 192.168.1.50. Protocol 53 discovers a matching room on the local network and follows a changed host address automatically. The numeric address remains a fast path and fallback for networks that block UDP broadcast. The host ignores this field. No hostname or Internet relay."
type = "String"
default = "192.168.1.50"

[[manifest.config_options]]
id = "host_recovery"
name = "Manual host recovery"
description = "Join-side recovery. Standby shows checkpoint readiness. After at least 120 fully synchronized, save-safe frames, the normal DK64 save and a checksummed companion journal preserve the last acknowledged checkpoint across process restarts. Select Promote now only after the old host is offline; the guest restarts its network session as host without switching or copying the loaded save. Pending requests, unsafe maps, reward queues, save conflicts and journal failures block promotion. A promoted Join using Automatic save-copy selection restores as Host on its next launch. Select an explicit save copy to override that automatic role recovery. A returning old host discovers a newer promoted authority, reopens its UDP session as Join with its existing host checkpoint copy, and remembers that follower role across restarts. Same-generation accidental hosts use their durable node identities as a deterministic tie-break. Save-ahead checks still stop divergent campaign data."
type = "Enum"
options = ["Off", "Standby / show checkpoint", "Promote now"]
default = "Off"

[[manifest.config_options]]
id = "recovery_save_copy"
name = "Recovery save copy (restart)"
description = "Normally leave Automatic: Host loads this device's host copy and Join loads its guest copy. A durably promoted Join automatically restores as Host with its guest copy. Selecting an explicit copy disables that automatic role override. A former host retired by a newer authority automatically rejoins with its existing host copy and remembers that role on restart. This selects an existing isolated campaign file; it never copies or merges raw save bytes. Use the same campaign number and back up both copies before changing it."
type = "Enum"
options = ["Automatic for role", "Host checkpoint copy", "Guest checkpoint copy"]
default = "Automatic for role"

[[manifest.config_options]]
id = "save_conflict"
name = "Guest-save conflict (host, restart)"
description = "Host only. Stop safely blocks item synchronization when the selected guest campaign contains permanent progress absent from the host. Merge guest progress imports that validated progress through the normal item/world grant and save paths, producing the union on the host and then the guest. Use only with the intended peer and campaign, wait for LAN ITEMS: SYNCED, then return this setting to Stop safely. It never copies raw save bytes and cannot import excluded temporary state."
type = "Enum"
options = ["Stop safely", "Merge guest progress into host"]
default = "Stop safely"

[[manifest.config_options]]
id = "port"
name = "UDP port"
description = "Use the same port on both devices. Windows may ask to allow private-network access."
type = "Number"
min = 1024
max = 65535
step = 1
precision = 0
default = 6464

[[manifest.config_options]]
id = "room"
name = "Six-digit room code"
description = "Match this on both devices to avoid accidental joins. This is not encryption: only use a trusted LAN."
type = "Number"
min = 100000
max = 999999
step = 1
precision = 0
default = 123456

[[manifest.config_options]]
id = "follow_host_transitions"
name = "Transition behavior (restart)"
description = "Join-side behavior only. Independent exploration ignores host transition tickets, so both players can use different maps while collectible and progression synchronization continues. Follow host makes the joining player follow the host through 169 reviewed ordinary Isles, lobby, level-portal, tunnel and interior routes when both are still in the same source map. Combat and the remote player model remain active only while both players share a map. The host setting is ignored; matching settings are not required."
type = "Enum"
options = ["Independent exploration", "Follow host"]
default = "Independent exploration"

[[manifest.config_options]]
id = "combat"
name = "Combat experiment (restart)"
description = "Opt in on BOTH peers. Shares reliable six-frame-held shot visuals, downward partial health and linked blue/gold beaver, regular Kremling, Klump, Mushroom Man, Robo-Kremling, Kosha, both Zingers, Robo-Zinger, bat, all five Kasplats, Shuris, Gimpfish, all three Klaptraps, Krossbones, Kaboom, Klobber, Pufftup, sheeted Kritter, both Mr. Dice variants, Sir Domino, Spiderling, glasses fireball, Ruler, Book and Toy Monster across 58 reviewed vanilla maps: the seven main levels, supported ordinary-enemy interiors, Hideout Helm, DK Isles and four lobbies. Compact 20-record pages cover every supported live enemy and pending defeat; duplicated page rotation is independent of render-frame timing. Both copies must link while alive; no historical kills. The third option also follows host enemy positions/facing when BOTH choose it. The fourth additionally corrects the guest's normalized frame only when both already run matching local enemy clips and the exact identity/life binding agrees. Each reciprocally bound pose sample is evaluated once so local animation advances between network updates. No clip, AI, attack state, effect or damage is transferred. AI/attacks, Giant Clam, encounter controllers, other enemies, boss behavior outside those bounded damage phases, excluded interiors/minigames, drops and player damage stay local. Eleven boss rounds are shared separately: Army Dillo, Dogadon, Mad Jack, Pufftoss, King Kut Out, the Fungi Spider final hit, DK/Diddy/Lanky/Chunky K. Rool rounds, and Tiny's shoe/toe damage. The host accepts the highest reciprocally bound logical phase and each game advances one step through its pinned vanilla handler and vulnerable-state gate. Movement modes also correct the guest position/facing for the other ten boss rounds from the reciprocally bound host record. Spider movement stays local to preserve all Spiderling wire slots. Full pose mode corrects a matching already-local boss clip to a normalized host frame and suppresses callbacks during that one visual evaluation. Real local collisions win, transition state defers remote advancement and behavior-hook conflicts fail closed. Experimental; not gameplay-validated."
type = "Enum"
options = ["Off", "Shots and enemy defeats", "Shots, defeats and enemy movement", "Shots, defeats, movement and enemy pose"]
default = "Off"

[[manifest.config_options]]
id = "same_area_events"
name = "Same-area events (restart)"
description = "Enable on BOTH peers. While both players occupy the same stable map and room epoch, the host publishes only reviewed loaded vanilla scripts for gates, doors, reversible water/day-night switches, script states and countdown timers, linked platforms, Hideout Helm's five instrument pads, the Factory Snatch Room grate, two punch switches, two breakable grates, coconut switch, four production switches, Chunky's cage switch, three instrument pads, Diddy's three 3-1-2-4 room switches, Lanky's piano, Tiny's dartboard, Galleon's Enguarde door, breakable gate, three cannon targets, six gun and five instrument/two slam switches, all eleven five-door-temple weapon panels, Fungi's main-map breakable door, five tunnel gun switches, Diddy night and Lanky mushroom slam switches, dark-attic guitar pad, Lanky attic slam switch, Winch Room up button and two Thornvine Barn slam boxes, the Mill-front slam box, rear-mill triangle pad and two rear-mill question boxes, the Aztec/Fungi lobby feather switches, Isles rocket-barrel trombone and Fairy Island sax pads and two Caves boulder pads, three breakable ice walls, Tiny's four-step Caves igloo target, Chunky's three Caves cabin gun targets, the three Castle basement slam switches, Castle Lanky/Tiny and DK/Diddy/Chunky crypt switches and Castle tree door switches, Llama Temple's coconut/bongo, grape and quicksand switches, its sixteen matching heads and Tiny Temple's opening/guitar/charge switches plus its ordered KONG letters, and Japes' seventeen Diddy-cage, hive, painting-room, Diddy-cave, Kong-hut, timed-door and Rambi switches plus its paired Mountain and GB slam switches, Aztec's four exterior gate switches, five revealed totem switches, three llama switches, Diddy's exterior guitar pad and all four blueprint-door switches, Giant Clam's four-phase open/close hazard cycle, and the Caves Ice Tomato board plus host countdown while both encounters are active. Typed switches enter only their pinned vanilla activation state; piano, dartboard and KONG-letter progress advances one locally gated step at a time; local scripts own timing, sounds, enemies and rewards. Giant Clam uses only its pinned opening/closing edges and stable countdown. The guest invokes the existing local script-state path; packets cannot name arbitrary objects or functions. Matching cutscenes may advance one camera phase per rendered frame toward the host even after a missed network sample, only when both games already run the same cutscene with the same flags. Only an allowlisted trigger may start its own vanilla sequence; packets cannot name a cutscene directly, award an item, force a transition or replay an ending. Different maps, loading, stale epochs and unsupported objects fail closed. Host state is authoritative except for bounded bidirectional Kosh, Minecart Mayhem, Rabbit Race, Batty Barrel Bandit and Owl Race success events; temporary state is not saved. The co-op menu exposes one adventure file; an unexpected file change through another mod disables this channel until restart. Requires the actual upstream 1.0.2 lifecycle event set; the official 1.0.2 tag still reports project version 1.0.1 internally, so event lookup is the effective compatibility check. Experimental and gameplay validation is pending."
type = "Enum"
options = ["Off", "Reviewed host-authoritative events"]
default = "Off"

[[manifest.config_options]]
id = "shared_items"
name = "Shared collectibles and upgrades (restart)"
description = "Enable on BOTH peers. Shares blueprints, fairies, crowns, keys, special coins, medals, all 201 GBs, 1700 ordinary banana/coin pickups, 104 balloons, 16 rainbow coins, Chunky's rear-Japes-boulder bunch and saved final K. Rool defeat. The receiver must already prove all keys, turn-ins, the lobby and K. Lumsy freed; the ending cutscene and transition remain local. Saved Arcade replay payment also transfers after the lever and Arcade GB, without deducting receiver coins. Incoming numeric rewards wait until you LEAVE THEIR LEVEL (Snide: leave HQ); play in a main world or Isles to apply. Also shares Kong rescues, shop moves/upgrades, melon capacity, eight key turn-ins and initial/final K. Lumsy flags. A device may establish its first complete snapshot in the reviewed ordinary gameplay maps, including ordinary interiors, all seven lobbies and Helm; those maps publish progress but defer received writes and saves until DK's treehouse, Isles or a main level. After each device captures one verified snapshot, item pages keep syncing while the players occupy different areas. Shares training, first slam and camera/shockwave. Also shares 87 Bananaport tags independently and eight B. Locker clearances. Incoming tags wait outside their map; leave lobbies to exchange clearance flags. Three hidden pads use their existing GBs; Japes hidden pad requires its GB reveal. Also shares llama rescue/temple cooling, seal rescue, five Giant Mushroom gun switches, first rabbit race and grown beanstalk. Also shares eight permanent Factory hatch/gate/core, two breakable-grate, question-mark-box, arcade-lever and crown-grate flags. Also covers the remaining reviewed permanent gates, walls, reveals and puzzle completions across all levels, Isles/lobbies and Helm, plus five pearls, boss-portal closure, training exit, Rareware room, Helm shutdown and coin/crown doors, and four more warp tags. Helm crown door needs any four crowns, coin door both special coins, Rareware room camera plus all fairies, closed boss portals their key. Permanent gate prerequisites do not spend items. Shared Troff feeding does deduct the matching available colored bananas. The first Japes gate uses this option; the obsolete standalone gate experiment has been retired. Interior-only lobby/training/fairy unlocks can arrive in any safe map. Reversible Fungi day/night, Galleon water height and the Caves-lobby pressure switch use separate host-authoritative revision lanes under this option. Wait for LAN WORLD: SYNCED before switching. Reversible LAN World state still requires live safe-map samples on both devices. By default receivers leave the affected level and re-enter; the separate automatic world-refresh option removes that whole-level trip when the receiver is already in an affected safe main map and can update the loaded Caves-lobby switch directly. Host wins concurrent or stale requests; reconnect discards uncommitted toggle requests and uses host save state. The Arcade payment's permanent access result is shared without its coin fee; temporary Arcade state, other temporary switches and machine timing stay local. With automatic world refresh Off, incoming world unlocks wait until you leave their level and re-entry loads them. With it On, 17 reviewed gate/hut/switch/door flags update their loaded vanilla scripts directly; complex changes save and reload the affected safe main map once. Only the same-area Training Grounds completion scene may be started remotely after exact prerequisites; other remote cutscenes, temporary carried items and refill drops remain blocked. Optional join-side host-follow teleport is limited to 169 reviewed ordinary lobby, level, tunnel and interior routes; other transitions and partner-pad activation remain local. Training Grounds can establish the first snapshot and receive its reviewed training flags plus exit switch after local reward queues drain; the four course maps and shops still defer writes. Remote rescues wait outside their level; K. Lumsy flags wait outside Isles. First slam (local or shared) must apply before higher upgrades. On fresh saves visit K. Lumsy locally to open Japes. Purchases charge only the buyer; health/ammo refills remain local. Troff and Scoff cumulative feeding now syncs for all five Kongs and seven levels: each missing fed banana is deducted from the same Kong and level available balance. Receive outside that level in Isles or another main world; then re-enter Troff and Scoff. The higher per-Kong fed count wins, not the sum of duplicate feedings. Different Kongs add toward the level total. Missing pickup credits delay feeding; no free bananas, remote feeding animation or forced boss transition. Wait for ITEMS: SYNCED before feeding again. Existing guest-only feeding may cause SAVE AHEAD. Retains isolated item saves; expanded ownership may reveal a guest-save-ahead conflict. Wait for SYNCED before collecting on guest. Offline guest gains cause a save-ahead conflict. Film, crystals, orange refills and other excluded puzzles stay local. Vanilla setups only. Version 0.49.0 adds five typed Hideout Helm instrument pads, the Factory Snatch Room grate, two punch switches, two breakable grates, coconut switch, production, Chunky-cage, three instrument-pad and 3-1-2-4 room triggers, bounded piano-note, dartboard and Tiny Temple KONG-letter progression, real Galleon/Fungi timer samples, one Fungi main-map breakable-door, five tunnel-gun, two main-map slam, two attic, one Winch Room, two Thornvine Barn, one Mill-front, one rear-mill pad and two rear-mill question-box triggers, two lobby feather-switch triggers, the Isles trombone- and sax-pad triggers, two Caves boulder-pad, three breakable-ice-wall, one bounded Tiny-igloo target, three Chunky-cabin target, three Castle basement-slam, five Castle crypt-switch and two Castle tree-door triggers, one Galleon Enguarde-door, one breakable-gate, three bounded cannon-target, six gun and seven instrument/slam triggers, all eleven five-door-temple panels, two Llama Temple rescue switches, its grape and quicksand switches, sixteen matching-head triggers, three Tiny Temple triggers and seventeen Japes gun/hut/wall/timed-door-switch, two paired-Mountain and one Mountain-GB trigger and three bounded Aztec llama-switch triggers, four exterior gate and five bounded totem switches, its exterior guitar pad and four blueprint-door triggers; it accepts valid model-two object ID zero and retains bounded read-only LAN diagnostics and preserves the final vanilla colored-banana location, saved K. Rool completion and saved Arcade replay payment through existing permanent flags without moving prior IDs; gameplay validation remains pending."
type = "Enum"
options = ["Off", "Unique collectibles"]
default = "Off"

[[manifest.config_options]]
id = "automatic_world_refresh"
name = "Auto-refresh shared world (restart)"
description = "Requires shared collectibles. When a permanent world flag arrives in a safe main map, 17 reviewed gate/hut/switch/door flags update all affected loaded vanilla scripts directly. Complex puzzles, actor spawns, water height and day/night run their reviewed loaded vanilla switch scripts; unsupported complex state saves and reloads the same map through its current entrance. Missing reviewed objects also fail closed to that reload. This removes the manual leave-and-return step; simple supported gates do not interrupt play, while fallback reloads return you to the entrance. Numeric collectibles, rescues, pads, other lobby state, interiors, shops, Troff and Scoff, bosses and minigames retain their existing safety rules. Enable independently on each receiving device; matching settings are not required. Experimental and gameplay validation is pending."
type = "Enum"
options = ["Off", "Live update with reload fallback"]
default = "Off"
